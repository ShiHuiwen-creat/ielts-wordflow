name: Bug report
description: Report a reproducible problem in IELTS WordFlow
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach personal learning backups, credentials, or security-sensitive details. Report vulnerabilities privately through the Security tab.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system and version
      placeholder: macOS 15 or Android 16
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity
      options:
        - Online
        - Offline
        - Switching between online and offline
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if they help. Do not include a real backup file.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no private learner data or credentials.
          required: true
